<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Secret Letter 💌</title>

<link rel="stylesheet" href="read.css">

</head>
<body class="default">

<div class="container">

<h1 class="title">💌 Secret Letter</h1>

<!-- Loading -->
<div id="loading">
<div class="spinner"></div>
<p>Đang mở thư...</p>
</div>

<!-- Error -->
<div id="error" class="hidden">
<p>❌ Không tìm thấy thư</p>
</div>

<!-- Password -->
<div id="passwordBox" class="hidden">

<p>🔒 Lá thư này được bảo vệ</p>

<input type="password" id="passwordInput" placeholder="Nhập mật khẩu">

<button id="unlockBtn">Mở thư</button>

<p id="wrongPassword" class="hidden">Sai mật khẩu</p>

</div>

<!-- Letter -->
<div id="letterContainer" class="hidden">

<h2 id="letterSubject"></h2>

<p class="meta">
<span id="letterTo"></span>
</p>

<div id="letterContent"></div>

</div>

</div>

<script src="read.js"></script>

</body>
</html>
