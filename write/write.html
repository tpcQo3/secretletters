<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viết Thư | SecretLetter</title>
<script src="write.js", defer></script>

<link href="https://fonts.googleapis.com/css2?family=Inter&family=Outfit:wght@300;400;500&family=Great+Vibes&family=Pacifico&family=Caveat&family=Montserrat:wght@400;500;600&family=Playfair+Display&family=Merriweather&family=Lora&family=Bitter&family=Raleway&family=Poppins&family=Roboto&family=Open+Sans&family=Ubuntu&family=Crimson+Text&family=Cormorant+Garamond&family=EB+Garamond&family=Dancing+Script&family=Satisfy&family=Tangerine&family=Indie+Flower&family=Fredoka+One&family=Quicksand&family=Nunito&family=Work+Sans&family=Josefin+Sans&family=Abril+Fatface&family=Bebas+Neue&family=Righteous&family=Alfa+Slab+One&family=Permanent+Marker&family=Lato&family=Source+Serif+Pro&family=PT+Serif&family=Libre+Baskerville&family=Dosis&family=IBM+Plex+Serif&family=Comfortaa&family=Fira+Sans&family=Overpass&family=Mulish&display=swap" rel="stylesheet">
<link rel="stylesheet" href="write.css">
</head>

<body class="default">

<div class="background-blur"></div>

<div class="card">
<h1>Viết một lá thư 💌</h1>

<form id="letterForm">
<div class="input-group">
<label for="to">Người nhận</label>
<input type="text" id="to" required maxlength="100">
</div>
<div class="input-group">
<label for="subject">Chủ đề</label>
<input type="text" id="subject" maxlength="150">
</div>
<div class="input-group">
<label>Nội dung</label>

<div class="toolbar">
<button type="button" onclick="format('bold')"><b>B</b></button>
<button type="button" onclick="format('italic')"><i>I</i></button>
<button type="button" onclick="format('underline')"><u>U</u></button>

<select id="fontSelectText">
<option value="">Chọn font</option>
<option value="Inter">Inter (Mặc định)</option>
<option value="Outfit">Outfit</option>
<option value="Georgia">Georgia</option>
<option value="Garamond">Garamond</option>
<option value="Times New Roman">Times New Roman</option>
<option value="Arial">Arial</option>
<option value="Verdana">Verdana</option>
<option value="Courier New">Courier New</option>
<option value="Comic Sans MS">Comic Sans MS</option>
<option value="Trebuchet MS">Trebuchet MS</option>
<option value="Impact">Impact</option>
<option value="Palatino">Palatino</option>
<option value="Great Vibes">Great Vibes</option>
<option value="Pacifico">Pacifico</option>
<option value="Caveat">Caveat</option>
<option value="Montserrat">Montserrat</option>
<option value="Playfair Display">Playfair Display</option>
<option value="Merriweather">Merriweather</option>
<option value="Lora">Lora</option>
<option value="Bitter">Bitter</option>
<option value="Raleway">Raleway</option>
<option value="Poppins">Poppins</option>
<option value="Roboto">Roboto</option>
<option value="Open Sans">Open Sans</option>
<option value="Ubuntu">Ubuntu</option>
<option value="Crimson Text">Crimson Text</option>
<option value="Cormorant Garamond">Cormorant Garamond</option>
<option value="EB Garamond">EB Garamond</option>
<option value="Dancing Script">Dancing Script</option>
<option value="Satisfy">Satisfy</option>
<option value="Tangerine">Tangerine</option>
<option value="Indie Flower">Indie Flower</option>
<option value="Fredoka One">Fredoka One</option>
<option value="Quicksand">Quicksand</option>
<option value="Nunito">Nunito</option>
<option value="Work Sans">Work Sans</option>
<option value="Josefin Sans">Josefin Sans</option>
<option value="Abril Fatface">Abril Fatface</option>
<option value="Bebas Neue">Bebas Neue</option>
<option value="Righteous">Righteous</option>
<option value="Alfa Slab One">Alfa Slab One</option>
<option value="Permanent Marker">Permanent Marker</option>
<option value="Lato">Lato</option>
<option value="Source Serif Pro">Source Serif Pro</option>
<option value="PT Serif">PT Serif</option>
<option value="Libre Baskerville">Libre Baskerville</option>
<option value="Dosis">Dosis</option>
<option value="IBM Plex Serif">IBM Plex Serif</option>
<option value="Comfortaa">Comfortaa</option>
<option value="Fira Sans">Fira Sans</option>
<option value="Overpass">Overpass</option>
<option value="Mulish">Mulish</option>
</select>

<input type="color" id="colorPicker">
</div>

<div id="editor" contenteditable="true" class="editor"></div>
<span id="charCount">0 / 2000</span>
</div>
<div class="row">
<div class="input-group half">
<label for="password">Mật khẩu (tuỳ chọn)</label>
<input type="password" id="password">
</div>

<div class="input-group half">
<label for="expiry">Thời hạn</label>
<select id="expiry">
<option value="1">1 ngày</option>
<option value="7" selected>7 ngày</option>
<option value="30">30 ngày</option>
<option value="0">Vĩnh viễn</option>
</select>
</div>
</div>
<div class="style-panel">
<h3>Tuỳ chỉnh phong cách ✨</h3>

<div class="input-group">
<label for="theme">Theme</label>
<select id="theme">
<option value="default">Default 📋</option>
<option value="romantic">Romantic 💕</option>
<option value="loving">Loving ❤️</option>
<option value="cute">Cute 🎀</option>
<option value="dracula">Dracula 🧛</option>
<option value="sunset">Sunset 🌅</option>
<option value="ocean">Ocean 🌊</option>
<option value="sakura">Sakura 🌸</option>
<option value="galaxy">Galaxy ✨</option>
<option value="midnight">Midnight 🌙</option>
<option value="forest">Forest 🌿</option>
<option value="bubble">Bubble 🫧</option>
</select>
</div>
</div>
<div class="preview">
  <h3>Xem trước 👀</h3>
  <div id="previewText"></div>
</div>
<button type="submit", class="send-btn">Tạo thư</button>

</form>

<div id="popup" class="popup hidden">
  <div class="popup-box">
    <p id="popupMessage"></p>
    <input type="text" id="popupLink" readonly>
    <div class="popup-actions">
      <button type="button" class="copy-btn" onclick="copyLink()">Sao chép 📋</button>
      <button type="button" class="close-btn" onclick="closePopup()">Đóng ✕</button>
    </div>
    <div id="copySuccess" class="copy-success hidden">✓ Đã sao chép!</div>
  </div>
</div>

</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSy...",
authDomain: "screctletters.firebaseapp.com",
projectId: "screctletters",
storageBucket: "screctletters.firebasestorage.app",
messagingSenderId: "916940604225",
appId: "1:916940604225:web:faf88856504271362ed7c0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= EDITOR ================= */

window.format = function(cmd){
document.execCommand(cmd, false, null);
};

document.getElementById("fontSelect").addEventListener("change", function(){
if(this.value){
document.execCommand("fontName", false, this.value);
}
});

document.getElementById("colorPicker").addEventListener("input", function(){
document.execCommand("foreColor", false, this.value);
});

const editor = document.getElementById("editor");
const charCount = document.getElementById("charCount");

editor.addEventListener("input", function(){
let length = editor.innerText.length;
charCount.textContent = length + " / 2000";
});

/* ================= THEME ================= */

const themes = ["default","romantic","loving","cute","dracula","sunset","ocean"];

document.getElementById("theme").addEventListener("change", function(){
themes.forEach(t => document.body.classList.remove(t));
document.body.classList.add(this.value);
});

/* ================= FORM SUBMIT ================= */

document.getElementById("letterForm").addEventListener("submit", async function(e){
e.preventDefault();

const id = Math.random().toString(36).substring(2,10);

await setDoc(doc(db,"letters",id),{
to: document.getElementById("to").value,
subject: document.getElementById("subject").value,
content: editor.innerHTML,
password: document.getElementById("password").value,
expiry: document.getElementById("expiry").value,
createdAt: Date.now()
});

alert("Tạo thư thành công!");
this.reset();
editor.innerHTML = "";
charCount.textContent = "0 / 2000";
});

</script>

</body>
</html>
